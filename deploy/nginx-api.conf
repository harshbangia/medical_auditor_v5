# Nginx snippet for Glowix Medical Auditor API
# Apply on EC2: include inside the `location /api/` block, then `sudo nginx -t && sudo systemctl reload nginx`
#
# 504 Bad Gateway on long audits is usually proxy_read_timeout (default ~60s).
# Full audits with OCR + RAG + vision can take 15–30+ minutes for large new cases.

location /api/ {
    proxy_pass http://127.0.0.1:8000/;   # adjust port to match uvicorn/glowix service
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow long-running audit requests (30 minutes)
    proxy_connect_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;

    # Large PDF uploads from Streamlit
    client_max_body_size 100M;
}
